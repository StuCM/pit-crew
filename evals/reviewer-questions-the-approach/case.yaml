schema_version: '1.1'
name: reviewer-questions-the-approach
description: 'A task faithfully builds the approved wrapper, but the code shows the approach is wrong: the reviewer returns QUESTION naming the sibling tasks, not PASS and not a fix in this task.'
tags: [crew-reviewer, brownfield]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 420
  allowed_tools:
    [Read, Glob, Grep, Skill, Agent, 'Bash(git log:*)', 'Bash(git show:*)', 'Bash(git diff:*)']
