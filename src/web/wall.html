                                      { class: 'ref', href: codeHref(x.path, x.line) },
                                      `${x.path.split('/').pop()}${x.line ? `:${x.line}` : ''}`,
                                    ),
                                  ),
                                )
                              : null,
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              )
            : null,
        ];
      }

      function viewFiles() {
        const byPath = new Map();
        const add = (path, line, role, id, exists = true) => {
          const row = byPath.get(path) ?? {
            path,
            line,
            roles: new Set(),
            tasks: new Set(),
            exists,
          };
          row.roles.add(role);
          if (id) row.tasks.add(id);
          byPath.set(path, row);
        };
        for (const t of tasksHere()) {
          for (const f of t.files) add(f.path, null, f.exists ? 'Changed' : 'New', t.id, f.exists);
          for (const m of t.mentions) add(m.path, m.line, 'Mentioned', t.id);
        }
        for (const q of questions())
          for (const r of q.refs ?? []) add(r.path, r.line, 'Asked about');
        for (const f of W().findings ?? [])
          for (const r of f.rows) for (const x of r.refs ?? []) add(x.path, x.line, 'Evidence');
        const rows = [...byPath.values()].sort((a, b) => a.path.localeCompare(b.path));
        return [
          pagehead(
            'Files',
            'Everything this work changes, mentions or cites. A file under two tasks can collide when they merge.',
          ),
          el(
            'div',
            { class: 'actions' },
            el('a', { class: 'btn', href: '#dir/' }, 'Browse the repository'),
          ),
          rows.length
            ? el(
                'div',
                { class: 'panel tablewrap' },
                el(
                  'table',
                  {},
                  el(
                    'thead',
                    {},
                    el(
                      'tr',
                      {},
                      el('th', {}, 'File'),
                      el('th', {}, 'Role'),
                      el('th', {}, 'Tasks'),
                      el('th', {}, 'Open'),
                    ),
                  ),
                  el(
                    'tbody',
                    {},
                    rows.map((r) =>
                      el(
                        'tr',
                        {},
                        el(
                          'td',
                          { class: 'path' },
                          r.exists
                            ? el(
                                'a',
                                { href: codeHref(r.path, r.line), style: 'text-decoration:none' },
                                r.path,
                              )
                            : r.path,
                        ),
                        el('td', {}, [...r.roles].join(', ')),
                        el(
                          'td',
                          {},
                          [...r.tasks].map((id) => el('a', { class: 'tl', href: `#t${id}` }, id)),
                        ),
                        el('td', {}, fileLinks(r.path, r.line, r.exists)),
                      ),
                    ),
                  ),
                ),
              )
            : null,
        ];
      }

      function crumbs(path, file) {
        const parts = path ? path.split('/') : [];
        const out = [el('a', { href: '#dir/' }, data.project ?? 'repo')];
        parts.forEach((p, i) => {
          out.push(' / ');
          const sub = parts.slice(0, i + 1).join('/');
          out.push(
            i === parts.length - 1 && file ? el('b', {}, p) : el('a', { href: `#dir/${sub}` }, p),
          );
        });
        return el('div', { class: 'pathcrumbs' }, out);
      }

      async function viewCode(spec) {
        const m = /^(.*?)(?::(\d+))?$/.exec(spec);
        const [path, line] = [m[1], m[2] ? Number(m[2]) : null];
        const src = await get(`/api/file?path=${encodeURIComponent(path)}`);
        if (src.error)
          return [pagehead(path, `Cannot show this: ${src.error}.`, back('#files', 'Files'))];
        const table = el(
          'table',
          {},
          src.lines.map((text, i) =>
            el(
              'tr',
              { id: `L${i + 1}`, class: i + 1 === line ? 'hl' : null },
              el('td', { class: 'n' }, el('a', { href: codeHref(path, i + 1) }, i + 1)),
              el('td', {}, text),
            ),
          ),
        );
        return [
          back('#files', 'Files'),
          el(
            'div',
            { class: 'codehead' },
            crumbs(src.path, true),
            el(
              'span',
              { class: 'actions' },
              el(
                'button',
                {
                  type: 'button',
                  class: 'btn small primary',
                  onclick: () => openInEditor(src.path, line),
                },
                line ? `Open at line ${line}` : 'Open in editor',
              ),
              el(
                'button',
                {
                  type: 'button',
                  class: 'btn small',
                  onclick: () => askAbout(`About ${src.path}${line ? `:${line}` : ''}: `),
                },
                'Ask the scout',
              ),
              el(
                'button',
                {
                  type: 'button',
                  class: 'btn small',
                  onclick: () => copyText(`${src.path}${line ? `:${line}` : ''}`),
                },
                'Copy path',
              ),
            ),
          ),
          src.truncated ? el('p', { class: 'note' }, 'Only the first 512KB is shown.') : null,
          el('div', { class: 'panel code' }, table),
        ];
      }

      async function viewDir(path) {
        const dir = await get(`/api/dir?path=${encodeURIComponent(path)}`);
        if (dir.error)
          return [pagehead(path || 'Repository', 'Not found.', back('#files', 'Files'))];
        return [
          back('#files', 'Files'),
          crumbs(dir.path, false),
          el(
            'div',
            { class: 'panel dirlist' },
            dir.entries.map((e) =>
              el(
                'a',
                { href: e.dir ? `#dir/${e.path}` : codeHref(e.path) },
                el('span', { class: 'kind' }, e.dir ? 'dir' : 'file'),
                e.name + (e.dir ? '/' : ''),
              ),
            ),
          ),
        ];
      }

      let renderSeq = 0;
      async function render() {
        renderTabs();
        const r = route();
        const seq = ++renderSeq;
        let view;
        const taskRoute = /^t(\d+)(?:\/(changes|commit\/([0-9a-f]{7,40})))?$/.exec(r);
        if (taskRoute?.[3]) view = await viewCommit(taskRoute[1], taskRoute[3]);
        else if (taskRoute?.[2]) view = await viewChanges(taskRoute[1]);
        else if (taskRoute) view = viewTask(taskRoute[1]);
        else if (r.startsWith('code/')) view = await viewCode(r.slice(5));
        else if (r.startsWith('dir/')) view = await viewDir(r.slice(4));
        else
          view = (
            { tasks: viewTasks, questions: viewQuestions, scout: viewScout, files: viewFiles }[r] ??
            viewOverview
          )();
        if (seq !== renderSeq) return;
        $('#view').replaceChildren(...view.flat().filter(Boolean));
        // Scrolling has to wait until the page is drawn, not merely built.
        const line = /^code\/.*:(\d+)$/.exec(r)?.[1];
        if (line) document.getElementById(`L${line}`)?.scrollIntoView({ block: 'center' });
        const msgs = $('#msgs');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }
      addEventListener('hashchange', () => {
        render();
        if (!route().startsWith('code/')) scrollTo(0, 0);
      });
      $('#refresh').addEventListener('click', () => {
        loadProjects();
        load();
      });

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          toast('Copied');
        } catch {
          toast(text);
        }
      }

      // ---------- marking selected text ----------
      let pending = null;
      let kind = 'wrong';
      const selbar = $('#selbar');
      const sectionOf = (n) => (n?.nodeType === 3 ? n.parentElement : n)?.closest('[data-section]');
      function checkSelection() {
        const s = getSelection();
        if (!s || s.isCollapsed || !s.rangeCount) {
          selbar.hidden = true;
          return;
        }
        const range = s.getRangeAt(0);
        const a = sectionOf(range.startContainer);
        const quote = s.toString().trim();
        if (!a || a !== sectionOf(range.endContainer) || !quote || quote.length > 400) {
          selbar.hidden = true;
          return;
        }
        pending = { task: a.dataset.task, section: a.dataset.section, quote };
        const r = range.getBoundingClientRect();
        selbar.hidden = false;
        const w = selbar.offsetWidth;
        selbar.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
        selbar.style.top = `${r.top > 120 ? r.top - 48 : r.bottom + 8}px`;
      }
      let selTimer;
      document.addEventListener('selectionchange', () => {
        clearTimeout(selTimer);
        selTimer = setTimeout(checkSelection, 120);
      });
      addEventListener(
        'scroll',
        () => {
          if (!selbar.hidden) checkSelection();
        },
        { passive: true },
      );
      function setKind(k) {
        kind = k;
        for (const b of $('#composer-kinds').children)
          b.setAttribute('aria-pressed', b.dataset.kind === k ? 'true' : 'false');
        $('#composer-note').placeholder =
          k === 'wrong'
            ? 'What is wrong about it?'
            : k === 'change'
              ? 'What should it say instead?'
              : 'What do you want to know?';
      }
      selbar.addEventListener('mousedown', (e) => e.preventDefault());
      selbar.addEventListener('click', (e) => {
        const k = e.target.closest('button')?.dataset.kind;
        if (!k || !pending) return;
        $('#composer-where').textContent =
          pending.task === 'brief'
            ? 'Scout findings'
            : `Task ${pending.task} · ${pending.section.replace(/\.\d+$/, '')}`;
        $('#composer-quote').textContent = pending.quote;
        $('#composer-note').value = '';
        setKind(k);
        selbar.hidden = true;
        $('#composer').hidden = false;
        $('#composer-note').focus();
      });
      $('#composer-kinds').addEventListener('click', (e) => {
        const k = e.target.closest('button')?.dataset.kind;
        if (k) setKind(k);
      });
      $('#composer-cancel').addEventListener('click', () => {
        $('#composer').hidden = true;
        pending = null;
      });
      $('#composer').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!pending) return;
        if (
          (await post('/api/mark', { ...pending, kind, note: $('#composer-note').value })).marks
        ) {
          $('#composer').hidden = true;
          pending = null;
          getSelection()?.removeAllRanges();
          toast('Mark saved');
          load();
        }
      });
      addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          $('#composer').hidden = true;
          $('#suggester').hidden = true;
          selbar.hidden = true;
        }
      });

      // Task files change under us as workers report, so read them again every
      // few seconds while the page is in front of someone.
      loadProjects();
      load();
      setInterval(() => {
        if (document.visibilityState === 'visible' && !scoutBusy && pageOf(route()) !== 'files')
          load();
      }, 5000);
      setInterval(() => {
        if (document.visibilityState === 'visible') loadProjects();
      }, 30000);
    </script>
  </body>
</html>
