name: Skill evals

# The eval suite runs Claude against the plugin's skills and agents, so it
# costs money and is too variable to gate every push. Run it by hand before a
# release, or after changing a skill or agent prompt.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: '3'
      threshold:
        description: Fail if any case scores below this
        default: '0.8'

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cases that grant a shell run it inside Claude Code's sandbox, which
      # needs bubblewrap and socat, and Ubuntu 24.04 blocks the unprivileged
      # user namespaces bubblewrap relies on unless told otherwise.
      - name: Sandbox for shell tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: npm install --global @anthropic-ai/claude-code

      - name: Run the suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run eval -- --runs "${{ inputs.runs }}" --threshold "${{ inputs.threshold }}" \
            --json evals/results/ci.json --max-cost-usd 15

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
