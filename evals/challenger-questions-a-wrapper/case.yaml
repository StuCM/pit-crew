schema_version: '1.1'
name: challenger-questions-a-wrapper
description: 'A drafted plan wraps a broken function in a converter, and treats a question the person asked as a decision: the challenger finds both, with evidence, before approval.'
tags: [crew-spec, crew-challenger, brownfield]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Agent, 'Bash(git log:*)', 'Bash(git show:*)']
